[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crawler-service"
version = "0.1.0"
description = "FastAPI Crawl4AI news crawler service"
requires-python = ">=3.12"
dependencies = [
  "crawl4ai>=0.9.2",
  "playwright>=1.49.0",
  "beautifulsoup4>=4.12.3",
  "pydantic>=2.10.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".agents", "graphify-out", "data", "artifacts", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
