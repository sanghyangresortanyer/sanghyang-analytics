name: Nightly market data scrape

on:
  schedule:
    # 22:23 WIB (UTC+7). GitHub menunda job terjadwal 3-6 jam pada jam sibuk (tercatat Okt-Nov 2026),
    # jadi dijadwalkan lebih awal dan di menit sepi agar data selesai sebelum pagi.
    - cron: "23 15 * * *"
  workflow_dispatch:

# Tanpa izin bawaan; tiap job meminta izin minimum yang dipakainya.
permissions: {}

concurrency:
  group: nightly-market-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape berita dan tarif pasar
    runs-on: ubuntu-latest
    # Penalaran AI high membuat tiap panggilan ±15 detik (uji 26 Nov 2026: 14,7 detik untuk 25 promo, low 6,1 detik);
    # hari sibuk ±150 panggilan. Repo publik, jadi menit Actions tidak dibayar.
    timeout-minutes: 60
    permissions:
      contents: read
    # Seluruh tabel operasional VHP dan riset pasar berada dalam 1 schema PostgreSQL (public) di sanghyang-analytics (ADR-014).
    # Secret dipasang per langkah, bukan per job, supaya skrip instalasi dependensi di npm ci tidak pernah membacanya.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      # Crawl4AI adalah cadangan pembaca halaman umum (src/lib/market/browser-fallback.ts). Tarif Google Hotels selalu dibaca
      # dengan Chrome karena pilihan "Total per malam" harus dipastikan di halaman (src/lib/market/google-hotel-rate.ts). Bila
      # Crawl4AI gagal dijalankan, job tetap lanjut; kegagalannya tampil sebagai peringatan dan di ringkasan job.
      - name: Start Crawl4AI
        id: crawl4ai_start
        continue-on-error: true
        run: docker compose -f docker-compose.crawl4ai.yml up -d --build

      - name: Wait for Crawl4AI
        id: crawl4ai_health
        if: steps.crawl4ai_start.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.crawl4ai.yml logs
          exit 1

      - name: Choose rate reader
        id: crawler
        shell: bash
        env:
          START_OUTCOME: ${{ steps.crawl4ai_start.outcome }}
          HEALTH_OUTCOME: ${{ steps.crawl4ai_health.outcome }}
        run: |
          if [ "$START_OUTCOME" = "success" ] && [ "$HEALTH_OUTCOME" = "success" ]; then
            echo "url=http://127.0.0.1:8000" >> "$GITHUB_OUTPUT"
            echo "Crawl4AI siap sebagai cadangan pembaca halaman; tarif Google Hotels dibaca dengan Chrome."
            exit 0
          fi
          echo "url=" >> "$GITHUB_OUTPUT"
          reason="docker compose up: ${START_OUTCOME}, pemeriksaan kesehatan: ${HEALTH_OUTCOME:-skipped}"
          echo "::warning title=Crawl4AI tidak tersedia::Halaman dibaca tanpa cadangan Crawl4AI (${reason})."
          {
            echo "### Crawl4AI tidak tersedia"
            echo ""
            echo "Langkah Crawl4AI gagal (${reason}). Pembaruan tetap berjalan tanpa cadangan Crawl4AI; tarif Google Hotels tetap dibaca dengan Chrome."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Ringkasan per langkah (berhasil/sebagian/gagal/dilewati) ditulis skrip ini ke $GITHUB_STEP_SUMMARY.
      - name: Scrape news and market rates
        env:
          CRAWL4AI_URL: ${{ steps.crawler.outputs.url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MARKETING_PROPERTY_ID: ${{ secrets.MARKETING_PROPERTY_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRIMARY_MODEL: ${{ vars.PRIMARY_MODEL }}
          PRIMARY_THINKING_LEVEL: ${{ vars.PRIMARY_THINKING_LEVEL }}
          # Modul aplikasi (mis. src/lib/cache/cached.ts) mengimpor "server-only", yang melempar galat di luar kondisi
          # react-server; run pertama 26 Nov 2026 gagal karena ini. Sama dengan skrip test:market di package.json.
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx scripts/ops/run-nightly-scrape.ts

      # Runner dibuang setelah job; pembersihan yang gagal (misalnya Docker tidak pernah jalan) tidak membuat job data merah.
      - name: Stop Crawl4AI
        if: always()
        continue-on-error: true
        run: docker compose -f docker-compose.crawl4ai.yml down -v

  # Tarif per tipe kamar & sarapan (Google Travel) untuk Selasa & Sabtu terdekat. Hasilnya file data di repo,
  # jadi job ini meng-commit file itu ke main bila berubah; Vercel lalu deploy ulang dengan harga baru.
  room-rates:
    name: Tarif per tipe kamar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # meng-commit berkas data tarif kamar ke main
    steps:
      # Token tulis tidak disimpan di .git/config saat checkout; baru dipasang di langkah commit, setelah npm ci dan
      # perayapan selesai, sehingga kode dependensi dan halaman yang dirayapi tidak pernah berjalan bersama token itu.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      # Gagal validasi (Sanghyang atau <5 pembanding tidak tampil) = job merah dan file lama tetap dipakai.
      - name: Crawl room rates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/ops/crawl-room-rates.ts

      # Tarif resmi Sanghyang dari booking engine Exely (Search API kanal metasearch hotel) untuk tanggal yang baru ditulis
      # langkah di atas. Secret EXELY_* dipasang pemilik; bila kosong, langkah dilewati dengan pemberitahuan. Kegagalannya
      # tidak menahan commit tarif OTA, tetapi membuat job merah di langkah terakhir.
      - name: Crawl official room rates
        id: official_rates
        continue-on-error: true
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EXELY_API_BASE_URL: ${{ secrets.EXELY_API_BASE_URL }}
          EXELY_CLIENT_ID: ${{ secrets.EXELY_CLIENT_ID }}
          EXELY_CLIENT_SECRET: ${{ secrets.EXELY_CLIENT_SECRET }}
          EXELY_PROPERTY_ID: ${{ secrets.EXELY_PROPERTY_ID }}
        run: |
          missing=""
          for name in EXELY_API_BASE_URL EXELY_CLIENT_ID EXELY_CLIENT_SECRET EXELY_PROPERTY_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Tarif resmi dilewati::Secret repo belum diisi:${missing}. Tarif situs resmi tetap memakai data lama."
            {
              echo "### Tarif resmi dilewati"
              echo ""
              echo "Secret repo belum diisi:${missing}. Langkah ini jalan lagi setelah pemilik mengisinya di GitHub Secrets."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx tsx scripts/ops/crawl-official-room-rates.ts

      # Tarif booking engine resmi kompetitor (be.dip.id milik Nemuru) untuk tanggal yang sama dengan lapisan OTA: harga jual
      # termasuk paket sarapan wajib. Kegagalannya tidak menahan commit tarif OTA, tetapi membuat job merah di langkah terakhir.
      - name: Crawl competitor official room rates
        id: competitor_official_rates
        continue-on-error: true
        run: npx tsx scripts/ops/crawl-competitor-official-rates.ts

      - name: Commit updated room rates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          files=(src/lib/market/resort-room-rates.data.json src/lib/market/official-room-rates.data.json src/lib/market/competitor-official-rates.data.json)
          if git diff --quiet -- "${files[@]}"; then
            echo "Tarif kamar tidak berubah."
            exit 0
          fi
          # Gunakan identitas penulis commit terakhir agar riwayat commit dan pemicu deploy Vercel konsisten.
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add "${files[@]}"
          git commit -m "data(rooms): tarif per tipe kamar $(TZ=Asia/Jakarta date +%F)"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report official room rate failure
        if: steps.official_rates.outcome == 'failure'
        run: |
          echo "::error title=Tarif resmi gagal::crawl-official-room-rates.ts gagal; official-room-rates.data.json lama dipertahankan. Lihat log langkah Crawl official room rates."
          exit 1

      - name: Report competitor official room rate failure
        if: steps.competitor_official_rates.outcome == 'failure'
        run: |
          echo "::error title=Tarif resmi kompetitor gagal::crawl-competitor-official-rates.ts gagal; competitor-official-rates.data.json lama dipertahankan. Lihat log langkah Crawl competitor official room rates."
          exit 1
